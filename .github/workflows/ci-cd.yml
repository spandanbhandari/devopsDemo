name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image
        run: |
          cd app
          docker build -t demo-app:latest .
      
      - name: Simulate Push to Registry
        run: |
          echo "docker push your-dockerhub-username/demo-app:latest"
          echo "For this demo, we assume the push is successful."
  
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Simulate Deployment via SSH
        run: |
          echo "Here you would typically run:"
          echo "ssh user@server 'cd /opt/app && docker-compose down && docker-compose build && docker-compose up -d'"
          echo "Deployment successful."
